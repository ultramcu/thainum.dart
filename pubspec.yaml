name: thainum
description: >-
  A comprehensive Thai number toolkit: Thai numerals, number-to-words, baht text,
  formatting, Thai dates and times, and reverse parsing of Thai words to numbers.
version: 0.3.0
repository: https://github.com/ultramcu/thainum.dart
homepage: https://github.com/ultramcu/thainum.dart
issue_tracker: https://github.com/ultramcu/thainum.dart/issues
topics:
  - thai
  - number-to-words
  - baht
  - i18n
  - intl

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
